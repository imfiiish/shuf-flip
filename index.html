<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>洗牌 · 翻牌</title>
    <script>
      // 首屏前先定语言，避免标题/语言属性闪一下（key 与 src/lib/i18n.tsx 保持一致）
      ;(function () {
        try {
          var l = localStorage.getItem('vocab-lang')
          if (l !== 'zh' && l !== 'en') {
            l =
              (navigator.language || '').toLowerCase().indexOf('zh') === 0
                ? 'zh'
                : 'en'
          }
          document.documentElement.lang = l === 'zh' ? 'zh-CN' : 'en'
          document.title = l === 'zh' ? '洗牌 · 翻牌' : 'Shuf & Flip'
        } catch (e) {}
      })()
    </script>
    <script>
      // 首屏前先定主题，避免闪烁（key 与 src/theme.ts 保持一致）
      ;(function () {
        try {
          var m = localStorage.getItem('vocab-theme')
          var t =
            m === 'light' || m === 'dark'
              ? m
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.dataset.theme = t
        } catch (e) {}
      })()
    </script>
    <style>
      /* 首屏关键背景：在 JS 注入 index.css 之前就给 html 上色，避免刷新闪白。
         颜色须与 src/index.css 的 --bg 保持一致（亮 #efe6d3 / 暗 #223026）。
         跟随 data-theme，切换主题时也会自动更新。 */
      html {
        background: #efe6d3;
        color-scheme: light;
      }
      html[data-theme='dark'] {
        background: #223026;
        color-scheme: dark;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
