<!doctype html>
<html lang="zh" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>输入文字 · 淡入淡出</title>
<style>
  :root {
    color-scheme: light;
    --font-ui: system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    --accent: #7a5f36;
    --bg: #efe6d3;
    --card: #fdf8ec;
    --card-active: #fffcf3;
    --border: #ddcfb2;
    --text: #2a2418;
    --muted: #837458;
    --on-accent: #fdf8ec;
    --card-shadow: 0 18px 40px -18px rgba(45, 32, 15, 0.5), 0 2px 6px -2px rgba(45, 32, 15, 0.28);
  }
  :root[data-theme='dark'] {
    color-scheme: dark;
    --accent: #c9bb8e;
    --bg: #223026;
    --card: #2c3c30;
    --card-active: #35463a;
    --border: #485c4d;
    --text: #e7f1ea;
    --muted: #a0b0a3;
    --on-accent: #221b10;
    --card-shadow: 0 18px 40px -18px rgba(6, 10, 4, 0.6), 0 2px 6px -2px rgba(6, 10, 4, 0.5);
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 26px; background: var(--bg); color: var(--text); font-family: var(--font-ui); }
  h1 { font-size: 1.15rem; margin: 0 0 6px; }
  p.note { color: var(--muted); font-size: .82rem; margin: 0 0 20px; line-height: 1.7; max-width: 980px; }
  code { font-family: ui-monospace, Menlo, monospace; font-size: .86em; }
  .bar { display: flex; gap: 8px; align-items: center; margin: 0 0 20px; }
  .bar .sp { margin-left: auto; color: var(--muted); font-size: .76rem; }
  .tbtn { font: inherit; font-size: .8rem; cursor: pointer; padding: 5px 13px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--card); color: var(--text); }
  .tbtn.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }
  .mock { background: color-mix(in srgb, var(--card) 55%, var(--bg)); border: 1px solid var(--border);
    border-radius: 14px; padding: 16px; text-align: center; }
  .label { font-size: .74rem; color: var(--muted); margin-bottom: 16px; font-weight: 600;
    display: flex; justify-content: space-between; gap: 8px; }
  .badge { background: var(--accent); color: var(--on-accent); font-size: .62rem; font-weight: 700;
    padding: 2px 7px; border-radius: 999px; }
  .desc { margin-top: 16px; padding-top: 10px; border-top: 1px dashed var(--border);
    font-size: .72rem; color: var(--muted); line-height: 1.6; text-align: left; }

  .field { position: relative; width: min(280px, 100%); margin: 0 auto; height: 47px;
    background: var(--card-active); border-radius: 10px; box-shadow: var(--card-shadow); }
  .value { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 1.05rem; color: var(--text); }
  .ch { display: inline-block; }

  /* v1 逐字淡入 */
  .v1 .ch { animation: fadein 220ms ease; }
  @keyframes fadein { from { opacity: 0; } }

  /* v2 逐字淡入 + 整段微呼吸（每次输入整段轻暗一下）*/
  .v2 .ch { animation: fadein 220ms ease; }
  .v2 .value.dip { animation: dip 200ms ease; }
  @keyframes dip { 45% { opacity: 0.62; } }

  /* v3 整段淡出淡入（每次输入整段先淡出再淡入）*/
  .v3 .ch { animation: fadein 160ms ease; }
  .v3 .value.dip { animation: diphard 280ms ease; }
  @keyframes diphard { 40% { opacity: 0.12; } }

  /* v4 逐字淡入 + 轻微缩放 */
  .v4 .ch { animation: fadeinScale 240ms cubic-bezier(0.22, 1, 0.36, 1); }
  @keyframes fadeinScale { from { opacity: 0; transform: scale(0.9); } }
</style>
</head>
<body>
  <div class="bar">
    <button class="tbtn on" data-t="light">亮</button>
    <button class="tbtn" data-t="dark">暗</button>
    <span class="sp">每档自动打字 · 看文字怎么进</span>
  </div>

  <h1>输入文字 · 淡入淡出</h1>
  <p class="note">
    都是“淡”系（没有位移/弹跳）。报编号我就进 app 实现；想混搭也行。<br />
    v2/v3 是<b>每次输入整段一起淡</b>，v1/v4 是<b>只淡新字</b>。
  </p>

  <div class="grid">
    <div class="mock"><div class="label"><span>v1 · 逐字淡入</span></div>
      <div class="field v1" data-v="v1"><span class="value"></span></div>
      <div class="desc">只有新加的字从透明淡到实，其余不动。最安静。</div></div>

    <div class="mock"><div class="label"><span>v2 · 逐字淡入 + 整段微呼吸</span></div>
      <div class="field v2" data-v="v2"><span class="value"></span></div>
      <div class="desc">新字淡入，同时整行轻微暗一下再回来，像一次“呼吸”。</div></div>

    <div class="mock"><div class="label"><span>v3 · 整段淡出淡入</span></div>
      <div class="field v3" data-v="v3"><span class="value"></span></div>
      <div class="desc">每输入一个字，整行先淡出、再淡入（更明显的“淡出淡入”）。</div></div>

    <div class="mock"><div class="label"><span>v4 · 逐字淡入 + 微缩放</span></div>
      <div class="field v4" data-v="v4"><span class="value"></span></div>
      <div class="desc">新字淡入并轻微放大到位，比 v1 多一点“落定”感。</div></div>
  </div>

<script>
  const WORD = 'shufshuf'
  document.querySelectorAll('.field[data-v]').forEach((field, fi) => {
    const v = field.dataset.v
    const value = field.querySelector('.value')
    let i = 0
    setTimeout(() => {
      setInterval(() => {
        if (i >= WORD.length) { value.innerHTML = ''; value.classList.remove('dip'); i = 0; return }
        const s = document.createElement('span'); s.className = 'ch'; s.textContent = WORD[i]
        value.appendChild(s)
        if (v === 'v2' || v === 'v3') {
          value.classList.remove('dip'); void value.offsetWidth; value.classList.add('dip')
        }
        i++
      }, 300)
    }, fi * 170)
  })
  const root = document.documentElement
  document.querySelectorAll('.tbtn').forEach((b) => {
    b.addEventListener('click', () => {
      root.dataset.theme = b.dataset.t
      document.querySelectorAll('.tbtn').forEach((x) => x.classList.toggle('on', x === b))
    })
  })
</script>
</body>
</html>
